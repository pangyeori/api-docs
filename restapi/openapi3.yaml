openapi: 3.0.1
info:
  title: REST Docs Kotlin DSL API
  version: 0.0.1
servers:
- url: http://localhost:8080
tags: []
paths:
  /api/v1/debates:
    post:
      tags:
      - Debates
      summary: 토론방 생성
      description: 토론방 생성
      operationId: debates/create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-debates-1897433133"
            examples:
              debates/create-invalid-free-debate-time:
                value: |-
                  {
                    "title" : "시간 검증 토론",
                    "hostPosition" : "PROS",
                    "turnTimeSeconds" : 180,
                    "freeDebateTimeSeconds" : 1801
                  }
              debates/create-invalid-position:
                value: |-
                  {
                    "title" : "포지션 검증 토론",
                    "hostPosition" : "INVALID",
                    "turnTimeSeconds" : 180,
                    "freeDebateTimeSeconds" : 600
                  }
              debates/create-invalid-turn-time:
                value: |-
                  {
                    "title" : "시간 검증 토론",
                    "hostPosition" : "CONS",
                    "turnTimeSeconds" : 29,
                    "freeDebateTimeSeconds" : 600
                  }
              debates/create:
                value: |-
                  {
                    "title" : "AI는 인간을 대체할 것인가",
                    "description" : "AI 기술의 영향을 토론합니다.",
                    "hostPosition" : "PROS",
                    "turnTimeSeconds" : 180,
                    "freeDebateTimeSeconds" : 600
                  }
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-password-resets-confirm845673417"
              examples:
                debates/create-invalid-free-debate-time:
                  value: |-
                    {
                      "success" : false,
                      "data" : null,
                      "error" : {
                        "code" : "INVALID_INPUT",
                        "message" : "입력값이 올바르지 않습니다.",
                        "details" : [ {
                          "field" : "freeDebateTimeSeconds",
                          "message" : "자유 토론 시간은 60초 이상 1800초 이하여야 합니다."
                        } ]
                      }
                    }
                debates/create-invalid-position:
                  value: |-
                    {
                      "success" : false,
                      "data" : null,
                      "error" : {
                        "code" : "INVALID_INPUT",
                        "message" : "입력값이 올바르지 않습니다.",
                        "details" : [ {
                          "field" : "hostPosition",
                          "message" : "유효하지 않은 포지션입니다."
                        } ]
                      }
                    }
                debates/create-invalid-turn-time:
                  value: |-
                    {
                      "success" : false,
                      "data" : null,
                      "error" : {
                        "code" : "INVALID_INPUT",
                        "message" : "입력값이 올바르지 않습니다.",
                        "details" : [ {
                          "field" : "turnTimeSeconds",
                          "message" : "턴 시간은 30초 이상 600초 이하여야 합니다."
                        } ]
                      }
                    }
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-debates-277545979"
              examples:
                debates/create:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "id" : "0RQ5C1EHW6M2N",
                        "title" : "AI는 인간을 대체할 것인가",
                        "description" : "AI 기술의 영향을 토론합니다.",
                        "hostPosition" : "PROS",
                        "guestPosition" : "CONS",
                        "status" : "WAITING",
                        "turnTimeSeconds" : 180,
                        "freeDebateTimeSeconds" : 600,
                        "inviteToken" : "c43b96c1-a171-43de-8527-387c5b41350c"
                      },
                      "error" : null
                    }
      security:
      - bearerAuthJWT: []
  /api/v1/email-verifications:
    post:
      tags:
      - Email-verification
      summary: 이메일 인증 코드 발송
      description: 이메일 인증 코드 발송
      operationId: email-verification/send
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-email-verifications1872144117"
            examples:
              email-verification/send-rate-limited:
                value: |-
                  {
                    "email" : "rate-limited@pangyeori.com"
                  }
              email-verification/send-invalid-email:
                value: |-
                  {
                    "email" : "invalid-email"
                  }
              email-verification/send-missing-email:
                value: "{ }"
              email-verification/send:
                value: |-
                  {
                    "email" : "send-success@pangyeori.com"
                  }
      responses:
        "429":
          description: "429"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-email-verifications-1546988534"
              examples:
                email-verification/send-rate-limited:
                  value: |-
                    {
                      "success" : false,
                      "data" : null,
                      "error" : {
                        "code" : "EMAIL_VERIFICATION_RATE_LIMITED",
                        "message" : "인증 코드는 60초마다 한 번만 요청할 수 있습니다.",
                        "details" : null
                      }
                    }
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-email-verifications2114211361"
              examples:
                email-verification/send-invalid-email:
                  value: |-
                    {
                      "success" : false,
                      "data" : null,
                      "error" : {
                        "code" : "INVALID_INPUT",
                        "message" : "입력값이 올바르지 않습니다.",
                        "details" : [ {
                          "field" : "email",
                          "message" : "올바른 이메일 형식이 아닙니다."
                        } ]
                      }
                    }
                email-verification/send-missing-email:
                  value: |-
                    {
                      "success" : false,
                      "data" : null,
                      "error" : {
                        "code" : "INVALID_INPUT",
                        "message" : "입력값이 올바르지 않습니다.",
                        "details" : [ {
                          "field" : "email",
                          "message" : "이메일은 필수입니다."
                        } ]
                      }
                    }
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-email-verifications478885324"
              examples:
                email-verification/send:
                  value: |-
                    {
                      "success" : true,
                      "data" : { },
                      "error" : null
                    }
  /api/v1/notifications:
    get:
      tags:
      - Notifications
      summary: 내 알림 목록 조회
      description: 내 알림 목록 조회
      operationId: notifications/get-my-list-
      parameters:
      - name: cursor
        in: query
        description: 이전 응답의 nextCursor
        required: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: "페이지 크기 (기본 20, 최대 50)"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-notifications-775396230"
              examples:
                notifications/get-my-list-host:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "items" : [ {
                          "notificationId" : "0RQ5C2YER6M0K",
                          "debateId" : "0RQ5C2YEM6M5K",
                          "type" : "QUEUE_REQUEST_REMOVED",
                          "message" : "참가신청게스트님이 '내가 개설한 토론' 토론 참가 신청을 취소했습니다.",
                          "isRead" : false,
                          "createdAt" : "2026-09-24T10:45:58.64638"
                        }, {
                          "notificationId" : "0RQ5C2YER6M0J",
                          "debateId" : "0RQ5C2YEM6M5K",
                          "type" : "QUEUE_REQUEST_ADDED",
                          "message" : "참가신청게스트님이 '내가 개설한 토론' 토론 참가를 신청했습니다.",
                          "isRead" : false,
                          "createdAt" : "2026-09-24T10:45:58.646338"
                        } ],
                        "nextCursor" : null,
                        "hasNext" : false
                      },
                      "error" : null
                    }
                notifications/get-my-list-guest:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "items" : [ {
                          "notificationId" : "0RQ5C2TV06M6R",
                          "debateId" : "0RQ5C2TTW6M4Y",
                          "type" : "DEBATE_CANCELLED",
                          "message" : "'취소된 토론' 토론이 취소되었습니다.",
                          "isRead" : false,
                          "createdAt" : "2026-09-24T10:45:57.720189"
                        }, {
                          "notificationId" : "0RQ5C2T9R6M6T",
                          "debateId" : "0RQ5C2T9R6M6R",
                          "type" : "QUEUE_REQUEST_REJECTED",
                          "message" : "'내가 참가 거절된 토론' 토론 참가 요청이 거절되었습니다.",
                          "isRead" : false,
                          "createdAt" : "2026-09-24T10:45:57.582531"
                        }, {
                          "notificationId" : "0RQ5C2SSM6M60",
                          "debateId" : "0RQ5C2SSM6M5Y",
                          "type" : "QUEUE_REQUEST_ACCEPTED",
                          "message" : "'내가 참가 확정된 토론' 토론 참가가 확정되었습니다.",
                          "isRead" : false,
                          "createdAt" : "2026-09-24T10:45:57.453956"
                        } ],
                        "nextCursor" : null,
                        "hasNext" : false
                      },
                      "error" : null
                    }
      security:
      - bearerAuthJWT: []
  /api/v1/password-resets:
    post:
      tags:
      - PasswordReset
      summary: 비밀번호 재설정 토큰 발급
      description: 비밀번호 재설정 토큰 발급
      operationId: password-reset/issue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-password-resets-2041925858"
            examples:
              password-reset/issue-invalid-email:
                value: |-
                  {
                    "email" : "invalid-email"
                  }
              password-reset/issue-user-not-found:
                value: |-
                  {
                    "email" : "issue-unknown@pangyeori.com"
                  }
              password-reset/issue:
                value: |-
                  {
                    "email" : "issue-success@pangyeori.com"
                  }
              password-reset/issue-not-verified:
                value: |-
                  {
                    "email" : "not-verified@pangyeori.com"
                  }
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-password-resets-confirm845673417"
              examples:
                password-reset/issue-invalid-email:
                  value: |-
                    {
                      "success" : false,
                      "data" : null,
                      "error" : {
                        "code" : "INVALID_INPUT",
                        "message" : "입력값이 올바르지 않습니다.",
                        "details" : [ {
                          "field" : "email",
                          "message" : "올바른 이메일 형식이 아닙니다."
                        } ]
                      }
                    }
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-debates-debateId-invitations-request1852456402"
              examples:
                password-reset/issue-user-not-found:
                  value: |-
                    {
                      "success" : false,
                      "data" : null,
                      "error" : {
                        "code" : "USER_NOT_FOUND",
                        "message" : "존재하지 않는 사용자입니다.",
                        "details" : null
                      }
                    }
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-password-resets-1389490358"
              examples:
                password-reset/issue:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "passwordResetToken" : "<passwordResetToken>"
                      },
                      "error" : null
                    }
        "422":
          description: "422"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-debates-debateId-invitations-request1852456402"
              examples:
                password-reset/issue-not-verified:
                  value: |-
                    {
                      "success" : false,
                      "data" : null,
                      "error" : {
                        "code" : "EMAIL_NOT_VERIFIED",
                        "message" : "이메일 인증이 완료되지 않았습니다.",
                        "details" : null
                      }
                    }
  /api/v1/users:
    post:
      tags:
      - Users
      summary: 회원가입
      description: 회원가입
      operationId: users/create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-users-1262708799"
            examples:
              users/create-duplicate-email:
                value: |-
                  {
                    "email" : "duplicate@pangyeori.com",
                    "password" : "password123!",
                    "nickname" : "새사용자"
                  }
              users/create-invalid-nickname:
                value: |-
                  {
                    "email" : "invalid-nickname@pangyeori.com",
                    "password" : "password123!",
                    "nickname" : "판결이!"
                  }
              users/create-invalid-input:
                value: "{ }"
              users/create-not-verified:
                value: |-
                  {
                    "email" : "not-verified@pangyeori.com",
                    "password" : "password123!",
                    "nickname" : "미인증사용자"
                  }
              users/create-invalid-password:
                value: |-
                  {
                    "email" : "invalid-password@pangyeori.com",
                    "password" : "password123",
                    "nickname" : "판결이"
                  }
              users/create:
                value: |-
                  {
                    "email" : "signup-success@pangyeori.com",
                    "password" : "password123!",
                    "nickname" : "판결이"
                  }
      responses:
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-962038704"
              examples:
                users/create-duplicate-email:
                  value: |-
                    {
                      "success" : false,
                      "data" : null,
                      "error" : {
                        "code" : "EMAIL_ALREADY_EXISTS",
                        "message" : "이미 가입된 이메일입니다.",
                        "details" : null
                      }
                    }
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-nickname-duplicate-1728058300"
              examples:
                users/create-invalid-nickname:
                  value: |-
                    {
                      "success" : false,
                      "data" : null,
                      "error" : {
                        "code" : "INVALID_INPUT",
                        "message" : "입력값이 올바르지 않습니다.",
                        "details" : [ {
                          "field" : "nickname",
                          "message" : "닉네임은 특수문자를 포함할 수 없습니다."
                        } ]
                      }
                    }
                users/create-invalid-input:
                  value: |-
                    {
                      "success" : false,
                      "data" : null,
                      "error" : {
                        "code" : "INVALID_INPUT",
                        "message" : "입력값이 올바르지 않습니다.",
                        "details" : [ {
                          "field" : "nickname",
                          "message" : "닉네임은 필수입니다."
                        }, {
                          "field" : "password",
                          "message" : "비밀번호는 필수입니다."
                        }, {
                          "field" : "email",
                          "message" : "이메일은 필수입니다."
                        } ]
                      }
                    }
                users/create-invalid-password:
                  value: |-
                    {
                      "success" : false,
                      "data" : null,
                      "error" : {
                        "code" : "INVALID_INPUT",
                        "message" : "입력값이 올바르지 않습니다.",
                        "details" : [ {
                          "field" : "password",
                          "message" : "비밀번호는 특수문자를 1개 이상 포함해야 합니다."
                        } ]
                      }
                    }
        "422":
          description: "422"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-962038704"
              examples:
                users/create-not-verified:
                  value: |-
                    {
                      "success" : false,
                      "data" : null,
                      "error" : {
                        "code" : "EMAIL_NOT_VERIFIED",
                        "message" : "이메일 인증이 완료되지 않았습니다.",
                        "details" : null
                      }
                    }
        "201":
          description: "201"
