openapi: 3.0.1
info:
  title: Pangyeori REST API
  version: 0.0.1
servers:
- url: http://localhost:8080
tags: []
paths:
  /api/v1/debates:
    post:
      tags:
      - Debates
      summary: 토론방 생성
      description: 토론방 생성
      operationId: debates/create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-debates1449686951"
            examples:
              debates/create:
                value: "{\r\n  \"title\" : \"AI는 인간을 대체할 것인가\",\r\n  \"description\"\
                  \ : \"AI 기술의 영향을 토론합니다.\",\r\n  \"hostPosition\" : \"PROS\",\r\n\
                  \  \"turnTimeSeconds\" : 180,\r\n  \"freeDebateTimeSeconds\" : 600\r\
                  \n}"
              debates/create-invalid-free-debate-time:
                value: "{\r\n  \"title\" : \"시간 검증 토론\",\r\n  \"hostPosition\" : \"\
                  PROS\",\r\n  \"turnTimeSeconds\" : 180,\r\n  \"freeDebateTimeSeconds\"\
                  \ : 1801\r\n}"
              debates/create-invalid-position:
                value: "{\r\n  \"title\" : \"포지션 검증 토론\",\r\n  \"hostPosition\" :\
                  \ \"INVALID\",\r\n  \"turnTimeSeconds\" : 180,\r\n  \"freeDebateTimeSeconds\"\
                  \ : 600\r\n}"
              debates/create-invalid-turn-time:
                value: "{\r\n  \"title\" : \"시간 검증 토론\",\r\n  \"hostPosition\" : \"\
                  CONS\",\r\n  \"turnTimeSeconds\" : 29,\r\n  \"freeDebateTimeSeconds\"\
                  \ : 600\r\n}"
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-debates-277545979"
              examples:
                debates/create:
                  value: "{\r\n  \"success\" : true,\r\n  \"data\" : {\r\n    \"id\"\
                    \ : \"0RY2N8W4PGC0T\",\r\n    \"title\" : \"AI는 인간을 대체할 것인가\"\
                    ,\r\n    \"description\" : \"AI 기술의 영향을 토론합니다.\",\r\n    \"hostPosition\"\
                    \ : \"PROS\",\r\n    \"guestPosition\" : \"CONS\",\r\n    \"status\"\
                    \ : \"WAITING\",\r\n    \"turnTimeSeconds\" : 180,\r\n    \"freeDebateTimeSeconds\"\
                    \ : 600,\r\n    \"inviteToken\" : \"624f2a72-f699-4f56-bb7f-c6f7a6195d5e\"\
                    \r\n  },\r\n  \"error\" : null\r\n}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-password-resets-confirm845673417"
              examples:
                debates/create-invalid-free-debate-time:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_INPUT\",\r\n    \"message\"\
                    \ : \"입력값이 올바르지 않습니다.\",\r\n    \"details\" : [ {\r\n      \"\
                    field\" : \"freeDebateTimeSeconds\",\r\n      \"message\" : \"\
                    자유 토론 시간은 60초 이상 1800초 이하여야 합니다.\"\r\n    } ]\r\n  }\r\n}"
                debates/create-invalid-position:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_INPUT\",\r\n    \"message\"\
                    \ : \"입력값이 올바르지 않습니다.\",\r\n    \"details\" : [ {\r\n      \"\
                    field\" : \"hostPosition\",\r\n      \"message\" : \"유효하지 않은 포\
                    지션입니다.\"\r\n    } ]\r\n  }\r\n}"
                debates/create-invalid-turn-time:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_INPUT\",\r\n    \"message\"\
                    \ : \"입력값이 올바르지 않습니다.\",\r\n    \"details\" : [ {\r\n      \"\
                    field\" : \"turnTimeSeconds\",\r\n      \"message\" : \"턴 시간은\
                    \ 30초 이상 600초 이하여야 합니다.\"\r\n    } ]\r\n  }\r\n}"
      security:
      - bearerAuthJWT: []
  /api/v1/email-verifications:
    post:
      tags:
      - Email-verification
      summary: 이메일 인증 코드 발송
      description: 이메일 인증 코드 발송
      operationId: email-verification/send
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-email-verifications1872144117"
            examples:
              email-verification/send:
                value: "{\r\n  \"email\" : \"send-success@pangyeori.com\"\r\n}"
              email-verification/send-invalid-email:
                value: "{\r\n  \"email\" : \"invalid-email\"\r\n}"
              email-verification/send-missing-email:
                value: "{ }"
              email-verification/send-rate-limited:
                value: "{\r\n  \"email\" : \"rate-limited@pangyeori.com\"\r\n}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-email-verifications478885324"
              examples:
                email-verification/send:
                  value: "{\r\n  \"success\" : true,\r\n  \"data\" : { },\r\n  \"\
                    error\" : null\r\n}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-email-verifications2114211361"
              examples:
                email-verification/send-invalid-email:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_INPUT\",\r\n    \"message\"\
                    \ : \"입력값이 올바르지 않습니다.\",\r\n    \"details\" : [ {\r\n      \"\
                    field\" : \"email\",\r\n      \"message\" : \"올바른 이메일 형식이 아닙니다\
                    .\"\r\n    } ]\r\n  }\r\n}"
                email-verification/send-missing-email:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_INPUT\",\r\n    \"message\"\
                    \ : \"입력값이 올바르지 않습니다.\",\r\n    \"details\" : [ {\r\n      \"\
                    field\" : \"email\",\r\n      \"message\" : \"이메일은 필수입니다.\"\r\n\
                    \    } ]\r\n  }\r\n}"
        "429":
          description: "429"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-email-verifications-1546988534"
              examples:
                email-verification/send-rate-limited:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"EMAIL_VERIFICATION_RATE_LIMITED\"\
                    ,\r\n    \"message\" : \"인증 코드는 60초마다 한 번만 요청할 수 있습니다.\",\r\n\
                    \    \"details\" : null\r\n  }\r\n}"
  /api/v1/notifications:
    get:
      tags:
      - Notifications
      summary: 내 알림 목록 조회
      description: 내 알림 목록 조회
      operationId: notifications/get-my-list-
      parameters:
      - name: cursor
        in: query
        description: 이전 응답의 nextCursor
        required: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: "페이지 크기 (기본 20, 최대 50)"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-notifications-133349874"
              examples:
                notifications/get-my-list-guest:
                  value: "{\r\n  \"success\" : true,\r\n  \"data\" : {\r\n    \"items\"\
                    \ : [ {\r\n      \"notificationId\" : \"0RY2NCT2JGC7X\",\r\n \
                    \     \"debateId\" : \"0RY2NCT2EGC2V\",\r\n      \"type\" : \"\
                    DEBATE_CANCELLED\",\r\n      \"message\" : \"'취소된 토론' 토론이 취소되었\
                    습니다.\",\r\n      \"isRead\" : false,\r\n      \"createdAt\" :\
                    \ \"2026-10-15T22:24:41.108479\"\r\n    }, {\r\n      \"notificationId\"\
                    \ : \"0RY2NCSHEGC3S\",\r\n      \"debateId\" : \"0RY2NCSHAGC0G\"\
                    ,\r\n      \"type\" : \"QUEUE_REQUEST_REJECTED\",\r\n      \"\
                    message\" : \"'내가 참가 거절된 토론' 토론 참가 요청이 거절되었습니다.\",\r\n      \"\
                    isRead\" : false,\r\n      \"createdAt\" : \"2026-10-15T22:24:40.9710667\"\
                    \r\n    }, {\r\n      \"notificationId\" : \"0RY2NCS0JGC5W\",\r\
                    \n      \"debateId\" : \"0RY2NCS0EGC3T\",\r\n      \"type\" :\
                    \ \"QUEUE_REQUEST_ACCEPTED\",\r\n      \"message\" : \"'내가 참가\
                    \ 확정된 토론' 토론 참가가 확정되었습니다.\",\r\n      \"isRead\" : false,\r\n\
                    \      \"createdAt\" : \"2026-10-15T22:24:40.8365983\"\r\n   \
                    \ } ],\r\n    \"nextCursor\" : null,\r\n    \"hasNext\" : false\r\
                    \n  },\r\n  \"error\" : null\r\n}"
                notifications/get-my-list-host:
                  value: "{\r\n  \"success\" : true,\r\n  \"data\" : {\r\n    \"items\"\
                    \ : [ {\r\n      \"notificationId\" : \"0RY2NCWRJGC2Z\",\r\n \
                    \     \"debateId\" : \"0RY2NCWRJGC2W\",\r\n      \"type\" : \"\
                    QUEUE_REQUEST_REMOVED\",\r\n      \"message\" : \"참가신청게스트님이 '내\
                    가 개설한 토론' 토론 참가 신청을 취소했습니다.\",\r\n      \"isRead\" : false,\r\n\
                    \      \"createdAt\" : \"2026-10-15T22:24:41.796571\"\r\n    },\
                    \ {\r\n      \"notificationId\" : \"0RY2NCWRJGC2Y\",\r\n     \
                    \ \"debateId\" : \"0RY2NCWRJGC2W\",\r\n      \"type\" : \"QUEUE_REQUEST_ADDED\"\
                    ,\r\n      \"message\" : \"참가신청게스트님이 '내가 개설한 토론' 토론 참가를 신청했습니다\
                    .\",\r\n      \"isRead\" : false,\r\n      \"createdAt\" : \"\
                    2026-10-15T22:24:41.796571\"\r\n    } ],\r\n    \"nextCursor\"\
                    \ : null,\r\n    \"hasNext\" : false\r\n  },\r\n  \"error\" :\
                    \ null\r\n}"
      security:
      - bearerAuthJWT: []
  /api/v1/password-resets:
    post:
      tags:
      - PasswordReset
      summary: 비밀번호 재설정 토큰 발급
      description: 비밀번호 재설정 토큰 발급
      operationId: password-reset/issue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-password-resets-286140802"
            examples:
              password-reset/issue:
                value: "{\r\n  \"email\" : \"issue-success@pangyeori.com\"\r\n}"
              password-reset/issue-invalid-email:
                value: "{\r\n  \"email\" : \"invalid-email\"\r\n}"
              password-reset/issue-not-verified:
                value: "{\r\n  \"email\" : \"not-verified@pangyeori.com\"\r\n}"
              password-reset/issue-user-not-found:
                value: "{\r\n  \"email\" : \"issue-unknown@pangyeori.com\"\r\n}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-password-resets-1389490358"
              examples:
                password-reset/issue:
                  value: "{\r\n  \"success\" : true,\r\n  \"data\" : {\r\n    \"passwordResetToken\"\
                    \ : \"<passwordResetToken>\"\r\n  },\r\n  \"error\" : null\r\n\
                    }"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-password-resets-confirm845673417"
              examples:
                password-reset/issue-invalid-email:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_INPUT\",\r\n    \"message\"\
                    \ : \"입력값이 올바르지 않습니다.\",\r\n    \"details\" : [ {\r\n      \"\
                    field\" : \"email\",\r\n      \"message\" : \"올바른 이메일 형식이 아닙니다\
                    .\"\r\n    } ]\r\n  }\r\n}"
        "422":
          description: "422"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-me1852456402"
              examples:
                password-reset/issue-not-verified:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"EMAIL_NOT_VERIFIED\",\r\n    \"\
                    message\" : \"이메일 인증이 완료되지 않았습니다.\",\r\n    \"details\" : null\r\
                    \n  }\r\n}"
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-me1852456402"
              examples:
                password-reset/issue-user-not-found:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"USER_NOT_FOUND\",\r\n    \"message\"\
                    \ : \"존재하지 않는 사용자입니다.\",\r\n    \"details\" : null\r\n  }\r\n}"
  /api/v1/terms:
    get:
      tags:
      - Terms
      summary: 최신 약관 목록 조회
      description: 최신 약관 목록 조회
      operationId: terms/get-latest-terms
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-terms-366672699"
              examples:
                terms/get-latest-terms:
                  value: "{\r\n  \"success\" : true,\r\n  \"data\" : [ {\r\n    \"\
                    termsId\" : \"0RY2NDVHPGC7P\",\r\n    \"type\" : \"TERMS_OF_SERVICE\"\
                    ,\r\n    \"version\" : 2,\r\n    \"title\" : \"이용약관\",\r\n   \
                    \ \"content\" : \"이용약관 본문입니다. (v2)\",\r\n    \"required\" : true,\r\
                    \n    \"effectiveAt\" : \"2026-10-14T13:24:49.6775495\"\r\n  },\
                    \ {\r\n    \"termsId\" : \"0RY2NDVHPGC7Q\",\r\n    \"type\" :\
                    \ \"PRIVACY_POLICY\",\r\n    \"version\" : 1,\r\n    \"title\"\
                    \ : \"개인정보 수집·이용 동의\",\r\n    \"content\" : \"개인정보 수집·이용 동의 본문\
                    입니다. (v1)\",\r\n    \"required\" : true,\r\n    \"effectiveAt\"\
                    \ : \"2026-10-14T13:24:49.6775495\"\r\n  }, {\r\n    \"termsId\"\
                    \ : \"0RY2NDVHPGC7R\",\r\n    \"type\" : \"MARKETING\",\r\n  \
                    \  \"version\" : 1,\r\n    \"title\" : \"마케팅 수신 동의\",\r\n    \"\
                    content\" : \"마케팅 수신 동의 본문입니다. (v1)\",\r\n    \"required\" : false,\r\
                    \n    \"effectiveAt\" : \"2026-10-14T13:24:49.6775495\"\r\n  }\
                    \ ],\r\n  \"error\" : null\r\n}"
  /api/v1/users:
