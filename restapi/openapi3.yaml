  /api/v1/debate-invitations/{token}:
    get:
      tags:
      - Debates
      summary: 초대 링크 유효성 확인
      description: 초대 링크 유효성 확인
      operationId: debate-invitations/get
      parameters:
      - name: token
        in: path
        description: 만료되거나 존재하지 않는 초대 토큰
        required: true
        schema:
          type: string
      responses:
        "410":
          description: "410"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-debates-debateId-invitations-request1852456402"
              examples:
                debate-invitations/get-expired:
                  value: |-
                    {
                      "success" : false,
                      "data" : null,
                      "error" : {
                        "code" : "INVITE_TOKEN_EXPIRED",
                        "message" : "초대 링크가 만료되었습니다.",
                        "details" : null
                      }
                    }
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-debate-invitations-token-1234697103"
              examples:
                debate-invitations/get-guest-cancelled:
                  value: |-
                    {
                      "success" : true,
