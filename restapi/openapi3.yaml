      - Users
      summary: 회원가입
      description: 회원가입
      operationId: users/create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-users-1442370518"
            examples:
              users/create:
                value: "{\r\n  \"email\" : \"signup-success@pangyeori.com\",\r\n \
