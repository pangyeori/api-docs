<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pangyeori AsyncAPI Docs</title>
    <link rel="stylesheet" href="https://unpkg.com/@asyncapi/react-component@3.1.8/styles/default.min.css">
</head>

<body>
    <div id="asyncapi"></div>
    <script src="https://unpkg.com/@asyncapi/react-component@3.1.8/browser/standalone/index.js"></script>
    <script>
        fetch("./asyncapi.json")
            .then((res) => res.json())
            .then((spec) => {
                spec.info.description = "[asyncapi.json](./asyncapi.json)";
                const blobUrl = URL.createObjectURL(
                    new Blob([JSON.stringify(spec)], { type: "application/json" })
                );

                AsyncApiStandalone.render({
                    schema: {
                        url: blobUrl,
                        options: { method: "GET" },
                    },
                    config: {
                        show: { sidebar: true, errors: true },
                    },
                }, document.getElementById("asyncapi"));

                const observer = new MutationObserver(() => {
                    const link = document.querySelector('a[href="./asyncapi.json"]');
                    if (link && link.getAttribute("target") !== "_blank") {
                        link.setAttribute("target", "_blank");
                        link.setAttribute("rel", "noopener");
                    }
                });
                observer.observe(document.body, { childList: true, subtree: true });
            });
    </script>
</body>

</html>
