              users/create:
                value: "{\r\n  \"email\" : \"signup-success@pangyeori.com\",\r\n \
                  \ \"password\" : \"password123!\",\r\n  \"nickname\" : \"판결이\"\r\
                  \n}"
              users/create-duplicate-email:
                value: "{\r\n  \"email\" : \"duplicate@pangyeori.com\",\r\n  \"password\"\
                  \ : \"password123!\",\r\n  \"nickname\" : \"새사용자\"\r\n}"
              users/create-invalid-input:
                value: "{ }"
              users/create-invalid-nickname:
                value: "{\r\n  \"email\" : \"invalid-nickname@pangyeori.com\",\r\n\
                  \  \"password\" : \"password123!\",\r\n  \"nickname\" : \"판결이!\"\
                  \r\n}"
              users/create-invalid-password:
                value: "{\r\n  \"email\" : \"invalid-password@pangyeori.com\",\r\n\
                  \  \"password\" : \"password123\",\r\n  \"nickname\" : \"판결이\"\r\
                  \n}"
              users/create-not-verified:
                value: "{\r\n  \"email\" : \"not-verified@pangyeori.com\",\r\n  \"\
                  password\" : \"password123!\",\r\n  \"nickname\" : \"미인증사용자\"\r\n\
                  }"
