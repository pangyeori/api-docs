openapi: 3.0.1
info:
  title: REST Docs Kotlin DSL API
  version: 0.0.1
servers:
- url: http://localhost:8080
tags: []
paths:
  /api/v1/debates:
    post:
      tags:
      - Debates
      summary: 토론방 생성
      description: 토론방 생성
      operationId: debates/create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-debates1449686951"
            examples:
              debates/create:
                value: "{\r\n  \"title\" : \"AI는 인간을 대체할 것인가\",\r\n  \"description\"\
                  \ : \"AI 기술의 영향을 토론합니다.\",\r\n  \"hostPosition\" : \"PROS\",\r\n\
                  \  \"turnTimeSeconds\" : 180,\r\n  \"freeDebateTimeSeconds\" : 600\r\
                  \n}"
              debates/create-invalid-free-debate-time:
                value: "{\r\n  \"title\" : \"시간 검증 토론\",\r\n  \"hostPosition\" : \"\
                  PROS\",\r\n  \"turnTimeSeconds\" : 180,\r\n  \"freeDebateTimeSeconds\"\
                  \ : 1801\r\n}"
              debates/create-invalid-position:
                value: "{\r\n  \"title\" : \"포지션 검증 토론\",\r\n  \"hostPosition\" :\
                  \ \"INVALID\",\r\n  \"turnTimeSeconds\" : 180,\r\n  \"freeDebateTimeSeconds\"\
                  \ : 600\r\n}"
              debates/create-invalid-turn-time:
                value: "{\r\n  \"title\" : \"시간 검증 토론\",\r\n  \"hostPosition\" : \"\
                  CONS\",\r\n  \"turnTimeSeconds\" : 29,\r\n  \"freeDebateTimeSeconds\"\
                  \ : 600\r\n}"
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-debates-277545979"
              examples:
                debates/create:
                  value: "{\r\n  \"success\" : true,\r\n  \"data\" : {\r\n    \"id\"\
                    \ : \"0RHRT7AY4E43W\",\r\n    \"title\" : \"AI는 인간을 대체할 것인가\"\
                    ,\r\n    \"description\" : \"AI 기술의 영향을 토론합니다.\",\r\n    \"hostPosition\"\
                    \ : \"PROS\",\r\n    \"guestPosition\" : \"CONS\",\r\n    \"status\"\
                    \ : \"WAITING\",\r\n    \"turnTimeSeconds\" : 180,\r\n    \"freeDebateTimeSeconds\"\
                    \ : 600,\r\n    \"inviteToken\" : \"89a4f371-9899-4348-8a92-4586a5a9d1e4\"\
                    \r\n  },\r\n  \"error\" : null\r\n}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-auth-refresh1852456402"
              examples:
                debates/create-invalid-free-debate-time:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_FREE_DEBATE_TIME\",\r\n\
                    \    \"message\" : \"자유 토론 시간은 60초 이상 1800초 이하여야 합니다.\",\r\n \
                    \   \"details\" : null\r\n  }\r\n}"
                debates/create-invalid-position:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_POSITION\",\r\n    \"\
                    message\" : \"유효하지 않은 포지션입니다.\",\r\n    \"details\" : null\r\n\
                    \  }\r\n}"
                debates/create-invalid-turn-time:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_TURN_TIME\",\r\n    \"\
                    message\" : \"턴 시간은 30초 이상 600초 이하여야 합니다.\",\r\n    \"details\"\
                    \ : null\r\n  }\r\n}"
      security:
      - bearerAuthJWT: []
  /api/v1/email-verifications:
    post:
      tags:
      - Email-verification
      summary: 이메일 인증 코드 발송
      description: 이메일 인증 코드 발송
      operationId: email-verification/send
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-email-verifications1872144117"
            examples:
              email-verification/send:
                value: "{\r\n  \"email\" : \"send-success@pangyeori.com\"\r\n}"
              email-verification/send-invalid-email:
                value: "{\r\n  \"email\" : \"invalid-email\"\r\n}"
              email-verification/send-missing-email:
                value: "{ }"
              email-verification/send-rate-limited:
                value: "{\r\n  \"email\" : \"rate-limited@pangyeori.com\"\r\n}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-email-verifications-confirm478885324"
              examples:
                email-verification/send:
                  value: "{\r\n  \"success\" : true,\r\n  \"data\" : { },\r\n  \"\
                    error\" : null\r\n}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-email-verifications-confirm2114211361"
              examples:
                email-verification/send-invalid-email:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_INPUT\",\r\n    \"message\"\
                    \ : \"입력값이 올바르지 않습니다.\",\r\n    \"details\" : [ {\r\n      \"\
                    field\" : \"email\",\r\n      \"message\" : \"올바른 이메일 형식이 아닙니다\
                    .\"\r\n    } ]\r\n  }\r\n}"
                email-verification/send-missing-email:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_INPUT\",\r\n    \"message\"\
                    \ : \"입력값이 올바르지 않습니다.\",\r\n    \"details\" : [ {\r\n      \"\
                    field\" : \"email\",\r\n      \"message\" : \"이메일은 필수입니다.\"\r\n\
                    \    } ]\r\n  }\r\n}"
        "429":
          description: "429"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-email-verifications-confirm-1546988534"
              examples:
                email-verification/send-rate-limited:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"EMAIL_VERIFICATION_RATE_LIMITED\"\
                    ,\r\n    \"message\" : \"인증 코드는 60초마다 한 번만 요청할 수 있습니다.\",\r\n\
                    \    \"details\" : null\r\n  }\r\n}"
  /api/v1/password-resets:
    post:
      tags:
      - PasswordReset
      summary: 비밀번호 재설정 토큰 발급
      description: 비밀번호 재설정 토큰 발급
      operationId: password-reset/issue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-password-resets-286140802"
            examples:
              password-reset/issue:
                value: "{\r\n  \"email\" : \"issue-success@pangyeori.com\"\r\n}"
              password-reset/issue-invalid-email:
                value: "{\r\n  \"email\" : \"invalid-email\"\r\n}"
              password-reset/issue-not-verified:
                value: "{\r\n  \"email\" : \"not-verified@pangyeori.com\"\r\n}"
              password-reset/issue-user-not-found:
                value: "{\r\n  \"email\" : \"issue-unknown@pangyeori.com\"\r\n}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-password-resets-1389490358"
              examples:
                password-reset/issue:
                  value: "{\r\n  \"success\" : true,\r\n  \"data\" : {\r\n    \"passwordResetToken\"\
                    \ : \"<passwordResetToken>\"\r\n  },\r\n  \"error\" : null\r\n\
                    }"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-password-resets-confirm845673417"
              examples:
                password-reset/issue-invalid-email:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_INPUT\",\r\n    \"message\"\
                    \ : \"입력값이 올바르지 않습니다.\",\r\n    \"details\" : [ {\r\n      \"\
                    field\" : \"email\",\r\n      \"message\" : \"올바른 이메일 형식이 아닙니다\
                    .\"\r\n    } ]\r\n  }\r\n}"
        "422":
          description: "422"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-auth-refresh1852456402"
              examples:
                password-reset/issue-not-verified:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"EMAIL_NOT_VERIFIED\",\r\n    \"\
                    message\" : \"이메일 인증이 완료되지 않았습니다.\",\r\n    \"details\" : null\r\
                    \n  }\r\n}"
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-auth-refresh1852456402"
              examples:
                password-reset/issue-user-not-found:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"USER_NOT_FOUND\",\r\n    \"message\"\
                    \ : \"존재하지 않는 사용자입니다.\",\r\n    \"details\" : null\r\n  }\r\n}"
  /api/v1/users:
    post:
      tags:
      - Users
      summary: 회원가입
      description: 회원가입
      operationId: users/create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-users-1440468465"
            examples:
              users/create:
                value: "{\r\n  \"email\" : \"signup-success@pangyeori.com\",\r\n \
                  \ \"password\" : \"password123!\",\r\n  \"nickname\" : \"판결이\"\r\
                  \n}"
              users/create-duplicate-email:
                value: "{\r\n  \"email\" : \"duplicate@pangyeori.com\",\r\n  \"password\"\
                  \ : \"password123!\",\r\n  \"nickname\" : \"새사용자\"\r\n}"
              users/create-invalid-input:
                value: "{ }"
              users/create-invalid-nickname:
                value: "{\r\n  \"email\" : \"invalid-nickname@pangyeori.com\",\r\n\
                  \  \"password\" : \"password123!\",\r\n  \"nickname\" : \"판결이!\"\
                  \r\n}"
              users/create-invalid-password:
                value: "{\r\n  \"email\" : \"invalid-password@pangyeori.com\",\r\n\
                  \  \"password\" : \"password123\",\r\n  \"nickname\" : \"판결이\"\r\
                  \n}"
              users/create-not-verified:
                value: "{\r\n  \"email\" : \"not-verified@pangyeori.com\",\r\n  \"\
                  password\" : \"password123!\",\r\n  \"nickname\" : \"미인증사용자\"\r\n\
                  }"
      responses:
        "201":
          description: "201"
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-962038704"
              examples:
                users/create-duplicate-email:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"EMAIL_ALREADY_EXISTS\",\r\n  \
                    \  \"message\" : \"이미 가입된 이메일입니다.\",\r\n    \"details\" : null\r\
                    \n  }\r\n}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-nickname-duplicate-1728058300"
              examples:
                users/create-invalid-input:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_INPUT\",\r\n    \"message\"\
                    \ : \"입력값이 올바르지 않습니다.\",\r\n    \"details\" : [ {\r\n      \"\
                    field\" : \"nickname\",\r\n      \"message\" : \"닉네임은 필수입니다.\"\
                    \r\n    }, {\r\n      \"field\" : \"password\",\r\n      \"message\"\
                    \ : \"비밀번호는 필수입니다.\"\r\n    }, {\r\n      \"field\" : \"email\"\
                    ,\r\n      \"message\" : \"이메일은 필수입니다.\"\r\n    } ]\r\n  }\r\n\
                    }"
                users/create-invalid-nickname:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_INPUT\",\r\n    \"message\"\
                    \ : \"입력값이 올바르지 않습니다.\",\r\n    \"details\" : [ {\r\n      \"\
                    field\" : \"nickname\",\r\n      \"message\" : \"닉네임은 특수문자를 포함\
                    할 수 없습니다.\"\r\n    } ]\r\n  }\r\n}"
                users/create-invalid-password:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_INPUT\",\r\n    \"message\"\
                    \ : \"입력값이 올바르지 않습니다.\",\r\n    \"details\" : [ {\r\n      \"\
                    field\" : \"password\",\r\n      \"message\" : \"비밀번호는 특수문자를 1개\
                    \ 이상 포함해야 합니다.\"\r\n    } ]\r\n  }\r\n}"
        "422":
          description: "422"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-962038704"
              examples:
                users/create-not-verified:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"EMAIL_NOT_VERIFIED\",\r\n    \"\
                    message\" : \"이메일 인증이 완료되지 않았습니다.\",\r\n    \"details\" : null\r\
                    \n  }\r\n}"
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: 토큰 재발급
      description: 토큰 재발급
      operationId: auth/refresh
      responses:
        "200":
          description: "200"
          headers:
            Set-Cookie:
              description: "refreshToken (회전된(rotate) 새 Refresh Token, HttpOnly)"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-auth-refresh1572681663"
              examples:
                auth/refresh:
                  value: "{\r\n  \"success\" : true,\r\n  \"data\" : {\r\n    \"accessToken\"\
                    \ : \"<jwtToken>\",\r\n    \"tokenType\" : \"Bearer\"\r\n  },\r\
                    \n  \"error\" : null\r\n}"
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-auth-refresh1852456402"
              examples:
                auth/refresh-missing-cookie:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_TOKEN\",\r\n    \"message\"\
                    \ : \"유효하지 않은 토큰입니다.\",\r\n    \"details\" : null\r\n  }\r\n}"
  /api/v1/auth/signin:
    post:
      tags:
      - Auth
      summary: 로그인
      description: 로그인
      operationId: auth/signin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-auth-signin536610982"
            examples:
              auth/signin:
                value: "{\r\n  \"email\" : \"signin@pangyeori.com\",\r\n  \"password\"\
                  \ : \"password123!\"\r\n}"
              auth/signin-invalid-password:
                value: "{\r\n  \"email\" : \"wrong-password@pangyeori.com\",\r\n \
                  \ \"password\" : \"wrong-password\"\r\n}"
              auth/signin-unknown-email:
                value: "{\r\n  \"email\" : \"unknown@pangyeori.com\",\r\n  \"password\"\
                  \ : \"password123!\"\r\n}"
      responses:
        "200":
          description: "200"
          headers:
            Set-Cookie:
              description: "refreshToken (발급된 Refresh Token, HttpOnly)"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-auth-signin640759275"
              examples:
                auth/signin:
                  value: "{\r\n  \"success\" : true,\r\n  \"data\" : {\r\n    \"accessToken\"\
                    \ : \"<jwtToken>\",\r\n    \"tokenType\" : \"Bearer\"\r\n  },\r\
                    \n  \"error\" : null\r\n}"
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-auth-refresh1852456402"
              examples:
                auth/signin-invalid-password:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_CREDENTIALS\",\r\n   \
                    \ \"message\" : \"이메일 또는 비밀번호가 올바르지 않습니다.\",\r\n    \"details\"\
                    \ : null\r\n  }\r\n}"
                auth/signin-unknown-email:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_CREDENTIALS\",\r\n   \
                    \ \"message\" : \"이메일 또는 비밀번호가 올바르지 않습니다.\",\r\n    \"details\"\
                    \ : null\r\n  }\r\n}"
  /api/v1/auth/signout:
    post:
      tags:
      - Auth
      summary: 로그아웃
      description: 로그아웃
      operationId: auth/signout
      responses:
        "204":
          description: "204"
  /api/v1/debate-invitations/{token}:
    get:
      tags:
      - Debates
      summary: 초대 링크 유효성 확인
      description: 초대 링크 유효성 확인
      operationId: debate-invitations/get
      parameters:
      - name: token
        in: path
        description: 초대 토큰
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-debate-invitations-token-1295022690"
              examples:
                debate-invitations/get:
                  value: "{\r\n  \"success\" : true,\r\n  \"data\" : {\r\n    \"debateId\"\
                    \ : \"0RHRT6P04E43Y\",\r\n    \"title\" : \"참여 기능 토론\",\r\n  \
                    \  \"guestPosition\" : \"CONS\",\r\n    \"debateStatus\" : \"\
                    WAITING\",\r\n    \"guestStatus\" : null\r\n  },\r\n  \"error\"\
                    \ : null\r\n}"
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-auth-refresh1852456402"
              examples:
                debate-invitations/get-cancelled:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"DEBATE_CANCELLED\",\r\n    \"\
                    message\" : \"취소된 토론방입니다.\",\r\n    \"details\" : null\r\n  }\r\
                    \n}"
                debate-invitations/get-finished:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"DEBATE_FINISHED\",\r\n    \"message\"\
                    \ : \"이미 종료된 토론입니다.\",\r\n    \"details\" : null\r\n  }\r\n}"
                debate-invitations/get-in_progress:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"DEBATE_IN_PROGRESS\",\r\n    \"\
                    message\" : \"이미 시작된 토론입니다.\",\r\n    \"details\" : null\r\n \
                    \ }\r\n}"
                debate-invitations/get-ready:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"DEBATE_ALREADY_MATCHED\",\r\n\
                    \    \"message\" : \"이미 상대방이 매칭되었습니다.\",\r\n    \"details\" :\
                    \ null\r\n  }\r\n}"
        "410":
          description: "410"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-auth-refresh1852456402"
              examples:
                debate-invitations/get-expired:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVITE_TOKEN_EXPIRED\",\r\n  \
                    \  \"message\" : \"초대 링크가 만료되었습니다.\",\r\n    \"details\" : null\r\
                    \n  }\r\n}"
      security:
      - bearerAuthJWT: []
  /api/v1/email-verifications/confirm:
    post:
      tags:
      - Email-verification
      summary: 이메일 인증 코드 검증
      description: 이메일 인증 코드 검증
      operationId: email-verification/confirm
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-email-verifications-confirm-1686273376"
