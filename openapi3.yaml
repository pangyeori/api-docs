        "201":
          description: "201"
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-962038704"
              examples:
                users/create-duplicate-email:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"EMAIL_ALREADY_EXISTS\",\r\n  \
                    \  \"message\" : \"이미 가입된 이메일입니다.\",\r\n    \"details\" : null\r\
                    \n  }\r\n}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-nickname-duplicate-1728058300"
              examples:
                users/create-invalid-input:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_INPUT\",\r\n    \"message\"\
                    \ : \"입력값이 올바르지 않습니다.\",\r\n    \"details\" : [ {\r\n      \"\
                    field\" : \"nickname\",\r\n      \"message\" : \"닉네임은 필수입니다.\"\
                    \r\n    }, {\r\n      \"field\" : \"email\",\r\n      \"message\"\
                    \ : \"이메일은 필수입니다.\"\r\n    }, {\r\n      \"field\" : \"password\"\
                    ,\r\n      \"message\" : \"비밀번호는 필수입니다.\"\r\n    } ]\r\n  }\r\n\
                    }"
                users/create-invalid-nickname:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_INPUT\",\r\n    \"message\"\
                    \ : \"입력값이 올바르지 않습니다.\",\r\n    \"details\" : [ {\r\n      \"\
                    field\" : \"nickname\",\r\n      \"message\" : \"닉네임은 특수문자를 포함\
                    할 수 없습니다.\"\r\n    } ]\r\n  }\r\n}"
                users/create-invalid-password:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_INPUT\",\r\n    \"message\"\
                    \ : \"입력값이 올바르지 않습니다.\",\r\n    \"details\" : [ {\r\n      \"\
                    field\" : \"password\",\r\n      \"message\" : \"비밀번호는 특수문자를 1개\
                    \ 이상 포함해야 합니다.\"\r\n    } ]\r\n  }\r\n}"
        "422":
          description: "422"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-users-962038704"
              examples:
                users/create-not-verified:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"EMAIL_NOT_VERIFIED\",\r\n    \"\
                    message\" : \"이메일 인증이 완료되지 않았습니다.\",\r\n    \"details\" : null\r\
                    \n  }\r\n}"
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: 토큰 재발급
      description: 토큰 재발급
      operationId: auth/refresh
      responses:
        "200":
          description: "200"
          headers:
            Set-Cookie:
              description: "refreshToken (회전된(rotate) 새 Refresh Token, HttpOnly)"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-auth-refresh1572681663"
              examples:
                auth/refresh:
                  value: "{\r\n  \"success\" : true,\r\n  \"data\" : {\r\n    \"accessToken\"\
                    \ : \"<jwtToken>\",\r\n    \"tokenType\" : \"Bearer\"\r\n  },\r\
                    \n  \"error\" : null\r\n}"
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-auth-refresh1852456402"
              examples:
                auth/refresh-missing-cookie:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_TOKEN\",\r\n    \"message\"\
                    \ : \"유효하지 않은 토큰입니다.\",\r\n    \"details\" : null\r\n  }\r\n}"
  /api/v1/auth/signin:
    post:
      tags:
      - Auth
      summary: 로그인
      description: 로그인
      operationId: auth/signin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-auth-signin536610982"
            examples:
              auth/signin:
                value: "{\r\n  \"email\" : \"signin@pangyeori.com\",\r\n  \"password\"\
                  \ : \"password123!\"\r\n}"
              auth/signin-invalid-password:
                value: "{\r\n  \"email\" : \"wrong-password@pangyeori.com\",\r\n \
                  \ \"password\" : \"wrong-password\"\r\n}"
              auth/signin-unknown-email:
                value: "{\r\n  \"email\" : \"unknown@pangyeori.com\",\r\n  \"password\"\
                  \ : \"password123!\"\r\n}"
      responses:
        "200":
          description: "200"
          headers:
            Set-Cookie:
              description: "refreshToken (발급된 Refresh Token, HttpOnly)"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-auth-signin640759275"
              examples:
                auth/signin:
                  value: "{\r\n  \"success\" : true,\r\n  \"data\" : {\r\n    \"accessToken\"\
                    \ : \"<jwtToken>\",\r\n    \"tokenType\" : \"Bearer\"\r\n  },\r\
                    \n  \"error\" : null\r\n}"
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-auth-refresh1852456402"
              examples:
                auth/signin-invalid-password:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_CREDENTIALS\",\r\n   \
                    \ \"message\" : \"이메일 또는 비밀번호가 올바르지 않습니다.\",\r\n    \"details\"\
                    \ : null\r\n  }\r\n}"
                auth/signin-unknown-email:
                  value: "{\r\n  \"success\" : false,\r\n  \"data\" : null,\r\n  \"\
                    error\" : {\r\n    \"code\" : \"INVALID_CREDENTIALS\",\r\n   \
                    \ \"message\" : \"이메일 또는 비밀번호가 올바르지 않습니다.\",\r\n    \"details\"\
                    \ : null\r\n  }\r\n}"
  /api/v1/auth/signout:
    post:
      tags:
      - Auth
      summary: 로그아웃
      description: 로그아웃
      operationId: auth/signout
      responses:
        "204":
          description: "204"
